name: Publish 0.4.6 updater release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v046.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Download validated 0.4.6 artifact
        shell: pwsh
        run: |
          $url = 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-b38c-8210-b695-f3ebb8088aae/raw?se=2026-10-05T12%3A24%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=1e0846a5-c2c9-51ac-bfcd-78ef06d6f9ea&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T09%3A07%3A09Z&ske=2026-10-06T09%3A07%3A09Z&sks=b&skv=2026-02-06&sig=dzvyQmXBbcboygE5zS%2B6mjiHKB%2B5q7iJ1xd2fGFeEG0%3D'
          Invoke-WebRequest -Uri $url -OutFile artifact.zip
          Expand-Archive -Path artifact.zip -DestinationPath artifact
          $msi = Get-ChildItem artifact -Recurse -Filter 'SMC-Wireless-Studio-0.4.6-x64.msi' | Select-Object -First 1
          $sha = Get-ChildItem artifact -Recurse -Filter 'SMC-Wireless-Studio-0.4.6-x64.msi.sha256' | Select-Object -First 1
          if (-not $msi -or -not $sha) { throw '0.4.6 MSI or SHA256 file missing from validated artifact.' }
          Copy-Item $msi.FullName ./SMC-Wireless-Studio-0.4.6-x64.msi
          Copy-Item $sha.FullName ./SMC-Wireless-Studio-0.4.6-x64.msi.sha256
          $expected = ((Get-Content ./SMC-Wireless-Studio-0.4.6-x64.msi.sha256 -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash ./SMC-Wireless-Studio-0.4.6-x64.msi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "SHA256 mismatch: expected $expected actual $actual" }
      - name: Publish latest stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.4.6 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.4.6 ./SMC-Wireless-Studio-0.4.6-x64.msi ./SMC-Wireless-Studio-0.4.6-x64.msi.sha256 --repo $env:GITHUB_REPOSITORY --clobber
            gh release edit v0.4.6 --repo $env:GITHUB_REPOSITORY --prerelease=false --latest
            exit 0
          }
          gh release create v0.4.6 ./SMC-Wireless-Studio-0.4.6-x64.msi ./SMC-Wireless-Studio-0.4.6-x64.msi.sha256 --repo $env:GITHUB_REPOSITORY --target main --title 'SMC Wireless Studio 0.4.6' --notes @"
          ## SMC Wireless Studio 0.4.6

          - Külön, méretezhető eszközablak
          - Halvány, kártyás funkciótagolás
          - Új Topológia főmenü
          - Központi EXW1-BMTAC master pulzáló wireless animációval
          - Dinamikusan elrendezett, mozgatható remote node-ok
          - Élő wireless kapcsolat animáció
          - Projektenként mentett topológia-pozíciók
          - Dupla kattintásra remote részletes ablak
          - SMC termékcsalád-képek gyártói forrásból, helyi fallback-képpel
          "@ --latest
