name: Publish 0.4.8 updater release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v048.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Download validated 0.4.8 artifact
        shell: pwsh
        run: |
          $url = 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-2a28-8210-bb89-f5a7f443332c/raw?se=2026-10-05T13%3A01%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=d26454df-9151-50b1-91bd-8346245adf4c&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T07%3A26%3A47Z&ske=2026-10-06T07%3A26%3A47Z&sks=b&skv=2026-02-06&sig=vUhqYcp1jVCVPt31PZ2QgIy4SYv5kn1TqetC7GPXy8M%3D'
          Invoke-WebRequest -Uri $url -OutFile artifact.zip
          Expand-Archive -Path artifact.zip -DestinationPath artifact
          $msi = Get-ChildItem artifact -Recurse -Filter 'SMC-Wireless-Studio-0.4.8-x64.msi' | Select-Object -First 1
          $sha = Get-ChildItem artifact -Recurse -Filter 'SMC-Wireless-Studio-0.4.8-x64.msi.sha256' | Select-Object -First 1
          if (-not $msi -or -not $sha) { throw '0.4.8 MSI or SHA256 file missing from validated artifact.' }
          Copy-Item $msi.FullName ./SMC-Wireless-Studio-0.4.8-x64.msi
          Copy-Item $sha.FullName ./SMC-Wireless-Studio-0.4.8-x64.msi.sha256
          $expected = ((Get-Content ./SMC-Wireless-Studio-0.4.8-x64.msi.sha256 -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash ./SMC-Wireless-Studio-0.4.8-x64.msi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "SHA256 mismatch: expected $expected actual $actual" }
      - name: Publish latest stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.4.8 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.4.8 ./SMC-Wireless-Studio-0.4.8-x64.msi ./SMC-Wireless-Studio-0.4.8-x64.msi.sha256 --repo $env:GITHUB_REPOSITORY --clobber
            gh release edit v0.4.8 --repo $env:GITHUB_REPOSITORY --prerelease=false --latest
            exit 0
          }
          gh release create v0.4.8 ./SMC-Wireless-Studio-0.4.8-x64.msi ./SMC-Wireless-Studio-0.4.8-x64.msi.sha256 --repo $env:GITHUB_REPOSITORY --target main --title 'SMC Wireless Studio 0.4.8' --notes @"
          ## SMC Wireless Studio 0.4.8

          - Modern, háromsávos Wi-Fi/antenna packet animáció
          - A jel dinamikusan fordul és követi a remote pozícióját
          - Érkezéskor halvány ikon-glow
          - Drag közben szünetelő animáció a simább mozgatásért
          - A topológia csak valódi állapotváltozáskor renderelődik újra
          - SMC termékkép-cache: nincs több periodikus újratöltés/vibrálás
          "@ --latest
