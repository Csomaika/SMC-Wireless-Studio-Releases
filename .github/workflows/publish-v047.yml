name: Publish 0.4.7 updater release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v047.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Download validated 0.4.7 artifact
        shell: pwsh
        run: |
          $url = 'https://sdmntprukwest.oaiusercontent.com/files/00000000-d9ec-8243-8bf1-82cc2741a9d0/raw?se=2026-10-05T12%3A42%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=75e76d5b-62f7-5c61-b4dd-21b4ff8d0736&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T05%3A08%3A33Z&ske=2026-10-06T05%3A08%3A33Z&sks=b&skv=2026-02-06&sig=B%2BnW1Kjihv4GiNpZguphmLa94VixXFxibNhAZegi9Ls%3D'
          Invoke-WebRequest -Uri $url -OutFile artifact.zip
          Expand-Archive -Path artifact.zip -DestinationPath artifact
          $msi = Get-ChildItem artifact -Recurse -Filter 'SMC-Wireless-Studio-0.4.7-x64.msi' | Select-Object -First 1
          $sha = Get-ChildItem artifact -Recurse -Filter 'SMC-Wireless-Studio-0.4.7-x64.msi.sha256' | Select-Object -First 1
          if (-not $msi -or -not $sha) { throw '0.4.7 MSI or SHA256 file missing from validated artifact.' }
          Copy-Item $msi.FullName ./SMC-Wireless-Studio-0.4.7-x64.msi
          Copy-Item $sha.FullName ./SMC-Wireless-Studio-0.4.7-x64.msi.sha256
          $expected = ((Get-Content ./SMC-Wireless-Studio-0.4.7-x64.msi.sha256 -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash ./SMC-Wireless-Studio-0.4.7-x64.msi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "SHA256 mismatch: expected $expected actual $actual" }
      - name: Publish latest stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.4.7 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.4.7 ./SMC-Wireless-Studio-0.4.7-x64.msi ./SMC-Wireless-Studio-0.4.7-x64.msi.sha256 --repo $env:GITHUB_REPOSITORY --clobber
            gh release edit v0.4.7 --repo $env:GITHUB_REPOSITORY --prerelease=false --latest
            exit 0
          }
          gh release create v0.4.7 ./SMC-Wireless-Studio-0.4.7-x64.msi ./SMC-Wireless-Studio-0.4.7-x64.msi.sha256 --repo $env:GITHUB_REPOSITORY --target main --title 'SMC Wireless Studio 0.4.7' --notes @"
          ## SMC Wireless Studio 0.4.7

          - Vonalak helyett mozgó wireless impulzusok a master és az élő remote-ok között
          - A jel drag & drop közben is a remote aktuális helyét követi
          - Jelérkezéskor halvány ikon-felvillanás
          - Magasabb, rendezettebb node kártyák; a feliratok nem lógnak le
          - HighQuality képskálázás, nagyobb SMC termékkép próbálkozás
          - Automatikus fehérháttér-kivágás a termék körül, enyhe élesítéssel
          "@ --latest
