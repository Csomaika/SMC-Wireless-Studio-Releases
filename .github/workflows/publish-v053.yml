name: Publish 0.5.3 updater release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v053.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Download validated 0.5.3 MSI
        shell: pwsh
        run: |
          $msiUrl = 'https://release-assets.githubusercontent.com/github-production-release-asset/1373581388/feaac926-0b43-4c3d-82c9-49216faaee2c?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-10-06T08%3A32%3A42Z&rscd=attachment%3B+filename%3DSMC-Wireless-Studio-0.5.3-x64.msi&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-10-06T07%3A31%3A57Z&ske=2026-10-06T08%3A32%3A42Z&sks=b&skv=2018-11-09&sig=%2BFwamht8Jd4iEyREKA2hfpm%2B9M54GwyI1ylQsKDcqoY%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc5MTI3NDE5MSwibmJmIjoxNzkxMjcyMzkxLCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.Wkm0r5nd_wRq_Pt9jnbUegNl_V9_PD_NNurUE7vC-eU&response-content-disposition=attachment%3B%20filename%3DSMC-Wireless-Studio-0.5.3-x64.msi&response-content-type=application%2Foctet-stream'
          $shaUrl = 'https://release-assets.githubusercontent.com/github-production-release-asset/1373581388/6ce76e6f-4b75-4707-b4c8-9f0ad9d879b3?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-10-06T08%3A34%3A47Z&rscd=attachment%3B+filename%3DSMC-Wireless-Studio-0.5.3-x64.msi.sha256&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-10-06T07%3A34%3A10Z&ske=2026-10-06T08%3A34%3A47Z&sks=b&skv=2018-11-09&sig=jmIh2i4HiNwDauLIZPcfN%2Fi1X8f5kSXYcZF9q1uT888%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc5MTI3MjY5MSwibmJmIjoxNzkxMjcyMzkxLCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.g6NNPvsc7FLFmF0RHf9CpDGW3NpapXF6IS8JSfrvexQ&response-content-disposition=attachment%3B%20filename%3DSMC-Wireless-Studio-0.5.3-x64.msi.sha256&response-content-type=application%2Foctet-stream'
          Invoke-WebRequest -Uri $msiUrl -OutFile ./SMC-Wireless-Studio-0.5.3-x64.msi
          Invoke-WebRequest -Uri $shaUrl -OutFile ./SMC-Wireless-Studio-0.5.3-x64.msi.sha256
          $expected = ((Get-Content ./SMC-Wireless-Studio-0.5.3-x64.msi.sha256 -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash ./SMC-Wireless-Studio-0.5.3-x64.msi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "SHA256 mismatch: expected $expected actual $actual" }
          if ($actual -ne '3600bd32cad26622f513dd5c34e0ba084891b8feb0c28cea122257cd162be7ce') { throw "Unexpected validated MSI digest: $actual" }
      - name: Publish latest stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.5.3 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.5.3 ./SMC-Wireless-Studio-0.5.3-x64.msi ./SMC-Wireless-Studio-0.5.3-x64.msi.sha256 --repo $env:GITHUB_REPOSITORY --clobber
            gh release edit v0.5.3 --repo $env:GITHUB_REPOSITORY --prerelease=false --latest
            exit 0
          }
          gh release create v0.5.3 ./SMC-Wireless-Studio-0.5.3-x64.msi ./SMC-Wireless-Studio-0.5.3-x64.msi.sha256 --repo $env:GITHUB_REPOSITORY --target main --title 'SMC Wireless Studio 0.5.3' --notes @"
          ## SMC Wireless Studio 0.5.3

          - Live EXW1 wireless RSSI dashboard a főoldalon
          - Remote-onkénti RSSI dBm, ötfokozatú jelerősség-sáv és minősítés
          - Leggyengébb remote és átlag RSSI kiemelés
          - Élő RSSI trend az utolsó 60 mintával
          - PID/saját név és V2 remote inventory összekapcsolása
          - Read-only EXW1 web telemetria; a Modbus TCP kommunikáció ettől független
          - Nincs becsült/kitalált jelerősség; hibás vagy hiányzó adat egyértelműen jelölve
          "@ --latest
