name: Publish 0.5.1 updater release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v051.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Download validated 0.5.1 artifact
        shell: pwsh
        run: |
          $url = 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-2000-8246-95d5-993a83e8ab24/raw?se=2026-10-05T14%3A50%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=b0115734-1a2c-5cc3-a4ec-905b436b36eb&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T03%3A36%3A29Z&ske=2026-10-06T03%3A36%3A29Z&sks=b&skv=2026-02-06&sig=D5TZDa9GQrdHU61g9moB2vzxqoYFFFC1SwwTuALy51s%3D'
          Invoke-WebRequest -Uri $url -OutFile artifact.zip
          Expand-Archive -Path artifact.zip -DestinationPath artifact
          $msi = Get-ChildItem artifact -Recurse -Filter 'SMC-Wireless-Studio-0.5.1-x64.msi' | Select-Object -First 1
          $sha = Get-ChildItem artifact -Recurse -Filter 'SMC-Wireless-Studio-0.5.1-x64.msi.sha256' | Select-Object -First 1
          if (-not $msi -or -not $sha) { throw '0.5.1 MSI or SHA256 file missing from validated artifact.' }
          Copy-Item $msi.FullName ./SMC-Wireless-Studio-0.5.1-x64.msi
          Copy-Item $sha.FullName ./SMC-Wireless-Studio-0.5.1-x64.msi.sha256
          $expected = ((Get-Content ./SMC-Wireless-Studio-0.5.1-x64.msi.sha256 -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash ./SMC-Wireless-Studio-0.5.1-x64.msi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "SHA256 mismatch: expected $expected actual $actual" }
      - name: Publish latest stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.5.1 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.5.1 ./SMC-Wireless-Studio-0.5.1-x64.msi ./SMC-Wireless-Studio-0.5.1-x64.msi.sha256 --repo $env:GITHUB_REPOSITORY --clobber
            gh release edit v0.5.1 --repo $env:GITHUB_REPOSITORY --prerelease=false --latest
            exit 0
          }
          gh release create v0.5.1 ./SMC-Wireless-Studio-0.5.1-x64.msi ./SMC-Wireless-Studio-0.5.1-x64.msi.sha256 --repo $env:GITHUB_REPOSITORY --target main --title 'SMC Wireless Studio 0.5.1' --notes @"
          ## SMC Wireless Studio 0.5.1

          - Gombok felső highlight-csíkja eltávolítva
          - A Remote listában külön cím: A jelenleg párosított eszközök listája
          - Connected zöld, Disconnected piros, nem igazolt állapot sárga
          - A kiválasztott élő Connected remote finom zöld glow/pulse animációt kapott
          "@ --latest
